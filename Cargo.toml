[workspace]
members = ["camera-source"]
resolver = "3"

[package]
name = "droid-webcam"
version = "0.2.0"
edition = "2024"
license = "MIT"
default-run = "droid-webcam"

[dependencies]
hex = "0.4"
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.6"
droid-camera-source = { path = "camera-source" }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
subtle = "2"
zeroize = "1"

[profile.release]
strip = "debuginfo"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
